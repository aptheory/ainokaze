<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <script>
        // Check local storage for theme preference and apply it immediately
        (function() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme) {
                document.documentElement.setAttribute('data-theme', currentTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                // Optional: Apply system preference if no local storage setting found
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <nav>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/' | relative_url }}">Grid</a>
        <a href="{{ '/blog' | relative_url }}">Blog</a>
        <a href="{{ '/persona' | relative_url }}">Persona</a>  <button id="theme-toggle">🌙</button>
    </nav>

    <main>
        {{ content }}
    </main>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div id="modalCaption" class="modal-caption"></div>
    </div>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
