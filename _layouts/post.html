---
layout: default
---
<article class="full-post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <div class="back-link">
        <a href="{{ '/blog' | relative_url }}">← Back to Feed</a>
    </div>
</article>
